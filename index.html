<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Niflheim</title>
<style>
:root{
  --night:#0a1128; --deep:#111b3d; --line:#2b3d6e; --snow:#eaf4ff; --mist:#9fb4d3;
  --frost:#8fdcff; --ember:#ff9a5a; --bad:#ff7a8a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 70% at 50% 0%,#16245a 0%,var(--night) 62%);
  color:var(--snow);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;justify-content:center;align-items:flex-start;
  overflow-y:auto;
}
main{width:100%;max-width:380px;padding:56px 22px 40px}
h1{
  margin:0;font-family:"Palatino Linotype",Palatino,Georgia,serif;
  font-weight:400;font-size:56px;line-height:1;letter-spacing:.04em;
  color:var(--snow);text-shadow:0 0 28px rgba(143,220,255,.45);
}
.next{margin:14px 0 30px;color:var(--mist);font-size:15px;line-height:1.4}
.next b{color:var(--frost);font-weight:600}
#status{margin:0 0 18px;color:var(--mist);font-size:15px}
form{display:none}
form.show{display:block}
label{display:block;margin:0 0 14px;font-size:14px;color:var(--mist)}
input{
  display:block;width:100%;margin-top:6px;padding:13px 12px;
  background:var(--deep);color:var(--snow);
  border:1px solid var(--line);border-radius:8px;font-size:16px;
}
input:focus{outline:2px solid var(--frost);outline-offset:1px;border-color:var(--frost)}
.row{display:flex;gap:10px}
.row label:first-child{flex:0 0 96px}
.row label:last-child{flex:1}
button{
  width:100%;margin-top:6px;padding:14px;border:0;border-radius:8px;
  background:var(--frost);color:#06142b;font-size:16px;font-weight:700;cursor:pointer;
}
button:disabled{opacity:.55;cursor:default}
button:focus-visible{outline:2px solid var(--snow);outline-offset:2px}
.swap{
  margin-top:14px;background:none;color:var(--frost);font-weight:500;
  text-decoration:underline;text-underline-offset:3px;
}
#err{min-height:20px;margin:4px 0 0;color:var(--bad);font-size:14px}
.hide{display:none}
</style>
</head>
<body>
<main>
  <h1>Niflheim</h1>
  <p class="next" id="next"></p>
  <p id="status">Checking your session…</p>

  <form id="f" autocomplete="on">
    <label id="uwrap" class="hide">Username
      <input id="user" name="username" autocomplete="username" maxlength="50">
    </label>
    <div class="row">
      <label>Country code
        <input id="cc" name="cc" inputmode="numeric" autocomplete="tel-country-code" placeholder="234">
      </label>
      <label>Phone number
        <input id="ph" name="phone" inputmode="numeric" autocomplete="tel-national" placeholder="8012345678">
      </label>
    </div>
    <label>Password
      <input id="pw" name="password" type="password" autocomplete="current-password">
    </label>
    <p id="err" role="alert"></p>
    <button id="go" type="submit">Log in</button>
    <button id="swap" class="swap" type="button">New here? Create an account</button>
  </form>
</main>

<script>
const API_BASE = 'https://ariel-bot-38kh.onrender.com';
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
const world = q.get('world') === 'niflheim' ? 'niflheim' : 'pokemon';
const ticket = q.get('t');

$('next').innerHTML = world === 'niflheim'
  ? 'Next stop: the <b>Battle Arena</b>'
  : 'Next stop: the <b>Pokémon world</b>';

// Where to go once logged in. Niflheim links go to the arena (with the battle ticket);
// everything else goes to the Pokémon site, keeping any extra query such as ?scene=.
function destination() {
  if (world === 'niflheim') {
    return 'arena.html' + (ticket ? '?t=' + encodeURIComponent(ticket) : '');
  }
  const rest = new URLSearchParams(q);
  rest.delete('world'); rest.delete('t');
  const s = rest.toString();
  return 'pokemon.html' + (s ? '?' + s : '');
}
const go = () => location.replace(destination());

let signup = false;
function setMode(on) {
  signup = on;
  $('uwrap').classList.toggle('hide', !on);
  $('go').textContent = on ? 'Create account' : 'Log in';
  $('swap').textContent = on ? 'Already have an account? Log in' : 'New here? Create an account';
  $('pw').autocomplete = on ? 'new-password' : 'current-password';
  $('err').textContent = '';
}
$('swap').onclick = () => setMode(!signup);

function showForm() {
  $('status').classList.add('hide');
  $('f').classList.add('show');
}

async function checkSession() {
  try {
    const r = await fetch(API_BASE + '/api/auth/me', { credentials: 'include' });
    if (r.ok) return go();
    showForm();
  } catch (e) {
    // The server may be waking up; let the person try the form anyway.
    $('status').textContent = 'The server is waking up. You can still log in below.';
    $('f').classList.add('show');
  }
}

$('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const cc = $('cc').value.replace(/\D/g, '');
  const ph = $('ph').value.replace(/\D/g, '');
  const pw = $('pw').value;
  const name = $('user').value.trim();
  if (!cc || !ph) { $('err').textContent = 'Enter your country code and phone number.'; return; }
  if (!pw) { $('err').textContent = 'Enter your password.'; return; }
  if (signup && !name) { $('err').textContent = 'Choose a username.'; return; }
  $('err').textContent = '';
  $('go').disabled = true;
  try {
    const body = { countryCode: cc, phoneNumber: ph, password: pw };
    if (signup) body.username = name;
    const r = await fetch(API_BASE + (signup ? '/api/auth/signup' : '/api/auth/login'), {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (r.ok) return go();
    let j = {}; try { j = await r.json(); } catch (e) {}
    $('err').textContent = j.error || 'That didn’t work. Try again.';
  } catch (e) {
    $('err').textContent = 'Can’t reach the server. Check your connection and try again.';
  }
  $('go').disabled = false;
});

checkSession();
</script>
</body>
</html>
